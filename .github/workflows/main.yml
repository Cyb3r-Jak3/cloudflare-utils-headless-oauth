name: Deploy

on:
  push:
    branches:
      - '**'
    paths:
      - 'src/**'
      - '.github/workflows/main.yml'
      - 'package.json'
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths: ['package.json', '**/pnpm-lock.yaml', '.github/workflows/main.yml']

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        name: Install pnpm
        with:
          version: 11
          run_install: false
          cache: true

      - name: Install dependencies
        run: pnpm install

      - name: Test
        if: ${{github.ref_type == 'branch'}}
        run: |
          echo "CLIENT_ID=2548590435893489508349" >> .dev.vars
          echo "REDIRECT_URIS=http://localhost:8787/callback,https://example.com/cb" >> .dev.vars
          pnpm run test

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() && github.ref_type == 'branch' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
            use_oidc: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && github.ref_type == 'branch' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
            use_oidc: true
            report_type: 'test_results'

      - name: Run DB migrations
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: pnpm run db:apply:remote

      - name: Deploy to Cloudflare with Wrangler
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        with:
          command: deploy
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: 4